[package]
name = "ecma-runtime-cat"
version = "0.3.5"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, Object, Array, Error, ...) that the boa-cat engine exposes to scripts.  v0.3.5 adds the seven standard error constructors `Error`, `TypeError`, `RangeError`, `SyntaxError`, `ReferenceError`, `EvalError`, `URIError`.  Each is callable as `Error(message)` or `new Error(message)` and returns an Object with `name` (the constructor's name) and `message` (the first argument coerced via `to_string`)."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.7"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
