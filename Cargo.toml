[package]
name = "ecma-runtime-cat"
version = "0.3.3"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, Object, Array, ...) that the boa-cat engine exposes to scripts.  v0.3.3 adds `Object.{keys, values, entries, assign}` and `Array.isArray` static methods.  All four `Object` methods walk own data properties and skip the synthetic `length` slot when the source looks like an array; `Object.assign` also copies accessor pairs onto the target so getter/setter semantics survive the merge.  `Array.isArray(value)` returns `true` when `value` is an object whose own data-property keys are numeric or `length`."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.7"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
