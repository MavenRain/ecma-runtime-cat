[package]
name = "ecma-runtime-cat"
version = "0.3.0"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, ...) that the boa-cat engine exposes to scripts.  v0.3.0 adds the `Promise` global with `resolve(v)`, `reject(v)`, `all(arr)`, and `race(arr)` static methods, wrapping the boa-cat 0.6 promise infrastructure (`Heap::alloc_promise`, microtask driver, `.then` / `.catch` dispatch).  `Promise.resolve(p)` short-circuits for existing promises per spec; `all` / `race` over fully-settled inputs work synchronously, and the Pending-input orchestration lands once boa-cat ships continuation-passing transforms."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.6"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.2"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
