[package]
name = "ecma-runtime-cat"
version = "0.3.4"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, Object, Array, ...) that the boa-cat engine exposes to scripts.  v0.3.4 adds `Promise.allSettled(arr)` and `Promise.any(arr)`.  `allSettled` resolves with a per-input `{ status, value }` / `{ status, reason }` record, never short-circuiting.  `any` resolves with the first fulfilled input and rejects with an `AggregateError`-shaped object carrying every rejection reason when all inputs reject.  Both throw `TypeError` on Pending inputs for the same reason as `all` / `race`."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.7"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
