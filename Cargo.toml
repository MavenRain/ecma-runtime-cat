[package]
name = "ecma-runtime-cat"
version = "0.3.2"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, ...) that the boa-cat engine exposes to scripts.  v0.3.2 adds `JSON.parse(source)` alongside the existing `JSON.stringify`: a hand-rolled recursive-descent JSON parser that handles null / booleans / numbers (including scientific notation) / strings (with `\\\"` / `\\\\` / control-character / `\\uXXXX` escapes) / arrays / objects and rebuilds them as boa-cat `Value`s on the heap.  Throws `SyntaxError` on malformed input; the heap is snapshotted and restored on the error path so partial allocations don't leak."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.7"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
