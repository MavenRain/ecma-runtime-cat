[package]
name = "ecma-runtime-cat"
version = "0.3.1"
edition = "2024"
description = "ECMAScript runtime: native built-ins (console, Math, JSON, parseInt, isNaN, Promise, ...) that the boa-cat engine exposes to scripts.  v0.3.1 bumps to boa-cat 0.7 + ecma-parse-cat 0.3 so the shared parser / AST version tracks across the workspace; no source change since this crate doesn't itself parse user scripts and the v0.3 Promise built-in already targets the boa-cat 0.6-style promise API."
license = "MIT OR Apache-2.0"
keywords = ["ecmascript", "javascript", "runtime", "builtin", "boa"]
categories = ["development-tools"]

[dependencies]
boa-cat = "0.7"
ecma-syntax-cat = "0.1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
comp-cat-rs = "0.5"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
